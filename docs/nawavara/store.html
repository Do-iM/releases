<!doctype html>
<!--
  나와바라 스토어 링크 (https://apps.dee3.me/nawavara/store?c=<캠페인>). 인스타그램·스레드 프로필과 광고에 넣는 링크 하나.
  GitHub Pages 라 서버에서 넘길(302) 수 없어서, <head> 의 스크립트가 기기에 맞는 스토어로 바로 넘긴다 (location.replace: 뒤로 가기에 이 페이지가 남지 않게).
  - Android → Google Play (referrer 에 utm_source=link, utm_campaign=<c>)
  - iPhone·iPad (iPadOS 는 Mac 처럼 보이므로 터치가 되는 Macintosh 도 iPad 로 본다) → App Store (ct=<c>)
  - 그 밖(PC), 또는 앱 안 브라우저가 자동 이동을 막았을 때 → 이 페이지에 머물러 두 스토어 버튼을 보여 준다 (버튼에도 같은 캠페인 값).
  c 는 영문·숫자·_·- 만 남기고 40자에서 자른다 (App Store 의 ct 제한). 없으면 캠페인 값 없이 보낸다.
  store/index.html 이 아니라 store.html 인 것은 끝 / 로 한 번 더 넘어가는 단계를 없애려고.
  빌드가 없다. 이 파일 하나가 전부다 (Jekyll 은 머리말이 없는 .html 을 그대로 내보낸다).
-->
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>나와바라</title>
    <meta name="description" content="내 동네에서 모이고, 이야기하고, 만나요" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="나와바라" />
    <meta property="og:title" content="나와바라 - 지도에서 찾는 우리 동네 모임" />
    <meta property="og:description" content="내 동네에서 모이고, 이야기하고, 만나요" />
    <meta property="og:url" content="https://apps.dee3.me/nawavara/store" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:image" content="https://apps.dee3.me/nawavara/icon.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="나와바라 앱 아이콘" />
    <meta name="twitter:card" content="summary" />
    <link rel="icon" type="image/png" href="icon.png" />
    <link rel="apple-touch-icon" href="icon.png" />
    <script>
      "use strict";
      const c = (new URLSearchParams(location.search).get("c") || "").replace(/[^A-Za-z0-9_-]/g, "").slice(0, 40);
      const IOS = "https://apps.apple.com/app/apple-store/id6833378263?pt=126696895" + (c ? "&ct=" + c : "") + "&mt=8";
      const ANDROID =
        "https://play.google.com/store/apps/details?id=me.dee3.nawavara&referrer=" +
        encodeURIComponent("utm_source=link" + (c ? "&utm_campaign=" + c : ""));
      const ua = navigator.userAgent;
      const to = /Android/i.test(ua) ? ANDROID : /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1) ? IOS : null;
      if (to) location.replace(to);
    </script>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f6f6f4;
        --card: #ffffff;
        --text: #1b1b1a;
        --muted: #66655f;
        --line: #e2e1dc;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #161615;
          --card: #222220;
          --text: #ecebe6;
          --muted: #a3a29b;
          --line: #3a3936;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Segoe UI", sans-serif;
        word-break: keep-all;
        overflow-wrap: anywhere;
      }
      main {
        max-width: 520px;
        margin: 0 auto;
        padding: 48px 16px;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 28px 20px;
        text-align: center;
      }
      .icon {
        display: block;
        width: 96px;
        height: 96px;
        margin: 0 auto 16px;
        border-radius: 22px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 28px;
        line-height: 1.3;
      }
      p {
        margin: 0 0 24px;
        color: var(--muted);
      }
      .buttons {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
      }
      .buttons a {
        display: block;
        line-height: 0;
      }
      .buttons img {
        display: block;
        height: 52px;
        width: auto;
      }
    </style>
  </head>
  <body>
    <main>
      <section class="card">
        <img class="icon" src="icon.png" width="96" height="96" alt="" />
        <h1>나와바라</h1>
        <p>내 동네에서 모이고, 이야기하고, 만나요</p>
        <div class="buttons">
          <a id="ios" href="https://apps.apple.com/app/apple-store/id6833378263?pt=126696895&amp;mt=8"><img src="badge-app-store.png" width="168" height="52" alt="App Store에서 다운로드 하기" /></a>
          <a id="android" href="https://play.google.com/store/apps/details?id=me.dee3.nawavara&amp;referrer=utm_source%3Dlink"><img src="badge-google-play.png" width="175" height="52" alt="Google Play에서 다운로드" /></a>
        </div>
      </section>
    </main>
    <script>
      document.getElementById("ios").href = IOS;
      document.getElementById("android").href = ANDROID;
    </script>
  </body>
</html>
