# 모바일 앱 테스트 배포 (여러 앱 공용). Android 는 AAB 를 Play 내부 테스트 트랙에, iOS 는 IPA 를 TestFlight 에 올린다.
# 비공개 저장소 각 앱 브랜치의 mobile-release.yml 이 태그를 받으면 이 워크플로를 실행한다. 앱마다 파일을 따로 만들지 않는다.
# 앱 이름은 태그 앞부분(영문 소문자·숫자, `-` 없음)이고, 받은 소스의 tauri.conf.json identifier 마지막 부분과 같은지 확인한다.
# 패키지(Android 패키지, iOS 번들 ID)도 그 identifier 를 쓴다. 준비 단계는 공용 tauri-setup.
# 설치 파일은 공개 릴리스에 올리지 않는다. 예외: Play 업로드가 실패하면 AAB 를 산출물로 1일만 보관하고 실패로 끝낸다.
#
# 환경(environment)을 쓰지 않는다. Secrets 는 저장소 Secrets 에서 읽는다 (여러 앱이 같은 키를 함께 쓴다):
#   ANDROID_KEYSTORE(업로드 키 jks 의 base64), ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_PASSWORD,
#   PLAY_SERVICE_ACCOUNT_JSON, APPLE_API_KEY(.p8 내용)
# 저장소 변수(Variables, 비밀 아님): APPLE_TEAM_ID, APPLE_API_KEY_ID, APPLE_API_ISSUER
name: tauri-mobile
run-name: ${{ inputs.app }} ${{ inputs.version }} ${{ inputs.platforms }}

on:
  workflow_dispatch:
    inputs:
      app:
        description: 앱 이름 (예 nawavara). tauri.conf.json identifier 의 마지막 부분
        required: true
      ref:
        description: 빌드할 비공개 저장소의 커밋
        required: true
      version:
        description: 버전 (tauri.conf.json 의 version 과 같아야 한다)
        required: true
      platforms:
        description: 빌드할 플랫폼 목록
        default: '["android", "ios"]'
        required: true
      notes:
        description: 바뀐 점 (Play 테스트 버전의 출시 노트)
        required: true

permissions:
  contents: read

# 같은 앱은 한 번에 하나씩 (빌드 번호와 스토어 업로드가 겹치지 않게). 다른 앱끼리는 같이 돈다.
concurrency: tauri-mobile-${{ inputs.app }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.platforms) }}
    runs-on: ${{ matrix.platform == 'ios' && 'macos-latest' || 'ubuntu-latest' }}
    defaults:
      run:
        shell: bash
        working-directory: .
    env:
      RUSTFLAGS: -A warnings
      APP: ${{ inputs.app }}
      VERSION: ${{ inputs.version }}
      NOTES: ${{ inputs.notes }}
      RUN_NUMBER: ${{ github.run_number }}
      RUN_ATTEMPT: ${{ github.run_attempt }}
    steps:
      - uses: Do-iM/releases/.github/actions/tauri-setup@main
        with:
          repository: ${{ vars.TAURI_REPO }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.SOURCES_TOKEN }}
          source_path: .
          rust_targets: ${{ matrix.platform == 'ios' && 'aarch64-apple-ios' || 'aarch64-linux-android,armv7-linux-androideabi' }}
          cache_key: ${{ inputs.app }}-${{ matrix.platform }}

      # 스토어는 올릴 때마다 빌드 번호가 커져야 한다: 10000 + 실행 번호 × 10 + 시도 횟수 (Re-run 해도 커진다).
      # 10000 은 로컬에서 만든 AAB 의 번호(버전에서 계산, 0.1.0 → 1000)보다 크게 하려는 값이다.
      - name: Check the source and write the build config
        run: |
          [[ "$APP" =~ ^[a-z0-9]+$ ]] || { echo "Bad app $APP (영문 소문자·숫자만, - 없이)"; exit 1; }
          echo "BUILD_NUMBER=$((10000 + RUN_NUMBER * 10 + RUN_ATTEMPT))" >> "$GITHUB_ENV"
          node -e '
            const fs = require("fs");
            const { APP, VERSION, RUN_NUMBER, RUN_ATTEMPT, GITHUB_ENV } = process.env;
            const base = JSON.parse(fs.readFileSync("src-tauri/tauri.conf.json", "utf8"));
            if (base.version !== VERSION) throw new Error(`version ${VERSION} is not tauri.conf.json version ${base.version}`);
            // 앱 이름 = 식별자의 마지막 부분 (태그를 잘못 쳐서 다른 앱 이름으로 올라가지 않게).
            if (base.identifier.split(".").pop() !== APP) throw new Error(`app ${APP} is not the last part of identifier ${base.identifier}`);
            fs.appendFileSync(GITHUB_ENV, `APP_PACKAGE=${base.identifier}\n`);
            const n = 10000 + Number(RUN_NUMBER) * 10 + Number(RUN_ATTEMPT);
            fs.writeFileSync("src-tauri/tauri.ci.conf.json", JSON.stringify({
              bundle: { android: { versionCode: n }, iOS: { bundleVersion: String(n) } },
            }));
          '

      # ---------- Android ----------
      - if: matrix.platform == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - if: matrix.platform == 'android'
        name: Build AAB
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: upload
        run: |
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          echo "$ANDROID_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          {
            echo "storeFile=$RUNNER_TEMP/upload.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > src-tauri/gen/android/keystore.properties
          pnpm tauri android build --aab --target aarch64 armv7 --config src-tauri/tauri.ci.conf.json
          aab=$(find "$PWD/src-tauri/gen/android/app/build/outputs/bundle" -name '*.aab' | head -1)
          [ -n "$aab" ] || { echo "No AAB"; exit 1; }
          echo "AAB=$aab" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/whatsnew"
          node -e 'process.stdout.write([...process.env.NOTES].slice(0, 500).join(""))' > "$RUNNER_TEMP/whatsnew/whatsnew-ko-KR"

      - if: matrix.platform == 'android'
        id: play
        name: Upload to Play internal testing
        continue-on-error: true
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.APP_PACKAGE }}
          releaseFiles: ${{ env.AAB }}
          releaseName: ${{ inputs.version }} (${{ env.BUILD_NUMBER }})
          track: internal
          status: completed
          whatsNewDirectory: ${{ runner.temp }}/whatsnew

      # Play 업로드가 실패하면 AAB 를 받아 콘솔에 손으로 올릴 수 있게 남긴다.
      # 예: 서비스 계정 권한·JSON 문제, Play 가 받지 않는 상태의 앱. 손으로 올리면 그 버전은 그대로 쓸 수 있다.
      # 공개 저장소의 산출물은 GitHub 에 로그인한 누구나 받을 수 있으므로 하루만 둔다. 받은 뒤 바로 지워도 된다.
      - if: matrix.platform == 'android' && steps.play.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.app }}-${{ inputs.version }}-${{ env.BUILD_NUMBER }}-aab
          path: ${{ env.AAB }}
          retention-days: 1
          if-no-files-found: error

      - if: matrix.platform == 'android' && steps.play.outcome == 'failure'
        name: Play upload failed
        run: |
          echo "::error title=Play 업로드 실패::위 Upload to Play internal testing 단계의 오류를 확인한다. 이 버전이 필요하면 이 실행의 Artifacts 에서 AAB 를 받아 Play Console 내부 테스트에 손으로 올리고 출시한다."
          exit 1

      # ---------- iOS ----------
      - if: matrix.platform == 'ios'
        name: Build IPA and upload to TestFlight
        env:
          # 팀 ID, 키 ID, 발급자 ID 는 비밀이 아니라 저장소 변수(Variables)에서 읽는다. 비밀은 .p8 내용뿐이다.
          APPLE_DEVELOPMENT_TEAM: ${{ vars.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ vars.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ vars.APPLE_API_KEY_ID }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}
        run: |
          # App Store Connect API 키로 서명 인증서와 프로필을 자동으로 받는다 (Xcode 자동 서명).
          mkdir -p ~/.appstoreconnect/private_keys
          export APPLE_API_KEY_PATH=~/.appstoreconnect/private_keys/AuthKey_$APPLE_API_KEY.p8
          printf '%s' "$APPLE_API_KEY_CONTENT" > "$APPLE_API_KEY_PATH"
          pnpm tauri ios build --export-method app-store-connect --config src-tauri/tauri.ci.conf.json
          ipa=$(find src-tauri/gen/apple/build -name '*.ipa' | head -1)
          [ -n "$ipa" ] || { echo "No IPA"; exit 1; }
          xcrun altool --upload-app -t ios -f "$ipa" --apiKey "$APPLE_API_KEY" --apiIssuer "$APPLE_API_ISSUER"
