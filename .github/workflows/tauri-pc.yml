# PC 앱(macOS, Windows) 배포 (여러 앱 공용) → 공개 릴리스 + 앱 자체 업데이트 파일(updates 릴리스).
# 비공개 저장소 각 앱 브랜치의 pc-release.yml 이 태그를 받으면 이 워크플로를 실행한다. 앱마다 파일을 따로 만들지 않는다.
# 앱 이름은 태그 앞부분(영문 소문자·숫자, `-` 없음)이고, 받은 소스의 tauri.conf.json identifier 마지막 부분과 같은지 확인한다. 준비 단계는 공용 tauri-setup.
# 이 저장소의 릴리스 태그(<앱>-v…, <앱>-dev-v…)와 업데이트 파일(<앱>.json, <앱>-dev.json) 이름은 설치된 앱이 업데이트를 찾는 주소라 바꾸지 않는다.
# 앱마다 이 저장소에 환경(Environments) `<앱>`, `<앱>-dev` 가 있고 거기에 업데이트 서명 키(SIGNING_KEY, SIGNING_KEY_PASSWORD)가 있어야 한다.
name: tauri-pc
run-name: ${{ inputs.app }} ${{ inputs.channel }} ${{ inputs.version }} ${{ inputs.platforms }}

on:
  workflow_dispatch:
    inputs:
      app:
        description: 앱 이름 (예 screenchat). tauri.conf.json identifier 의 마지막 부분
        required: true
      display_name:
        description: 릴리스 이름에 쓰는 앱 이름 (tauri.conf.json 의 productName)
        required: true
      ref:
        description: 빌드할 비공개 저장소의 커밋
        required: true
      channel:
        description: prod(외부 배포) 또는 dev(내부 개발)
        type: choice
        options: [dev, prod]
        required: true
      version:
        description: 버전 (prod 는 tauri.conf.json 의 version 과 같아야 한다)
        required: true
      platforms:
        description: 빌드할 플랫폼 목록
        default: '["macos", "windows"]'
        required: true
      notes:
        description: 바뀐 점 (앱의 업데이트 화면에 보인다)
        required: true

permissions:
  contents: write

# 같은 앱·채널은 한 번에 하나씩 (같은 릴리스와 업데이트 파일을 동시에 고치지 않게).
concurrency: tauri-pc-${{ inputs.app }}-${{ inputs.channel }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.names.outputs.environment }}
      tag: ${{ steps.names.outputs.tag }}
      name: ${{ steps.names.outputs.name }}
      file: ${{ steps.names.outputs.file }}
    steps:
      - id: names
        env:
          APP: ${{ inputs.app }}
          DISPLAY_NAME: ${{ inputs.display_name }}
          CHANNEL: ${{ inputs.channel }}
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$APP" =~ ^[a-z0-9]+$ ]] || { echo "Bad app $APP (영문 소문자·숫자만, - 없이)"; exit 1; }
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "Bad version $VERSION"; exit 1; }
          case "$CHANNEL" in
            prod) suffix=""; label="" ;;
            dev) suffix="-dev"; label=" Dev" ;;
            *) echo "Bad channel $CHANNEL"; exit 1 ;;
          esac
          {
            echo "environment=$APP$suffix"
            echo "tag=$APP$suffix-v$VERSION"
            echo "name=$DISPLAY_NAME$label v$VERSION"
            echo "file=$APP$suffix.json"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    environment: ${{ needs.prepare.outputs.environment }}
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.platforms) }}
    runs-on: ${{ matrix.platform == 'macos' && 'macos-latest' || 'windows-latest' }}
    defaults:
      run:
        shell: bash
        working-directory: .
    env:
      RUSTFLAGS: -A warnings
      APP: ${{ inputs.app }}
      CHANNEL: ${{ inputs.channel }}
      VERSION: ${{ inputs.version }}
      DEV_CONFIG: src-tauri/tauri.dev.conf.json
    steps:
      - uses: Do-iM/releases/.github/actions/tauri-setup@main
        with:
          repository: ${{ vars.TAURI_REPO }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.SOURCES_TOKEN }}
          source_path: .
          rust_targets: ${{ matrix.platform == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
          cache_key: ${{ inputs.app }}

      - name: Write the channel's config
        run: |
          node -e '
            const fs = require("fs");
            const { APP, CHANNEL, VERSION, DEV_CONFIG } = process.env;
            const base = JSON.parse(fs.readFileSync("src-tauri/tauri.conf.json", "utf8"));
            // 앱 이름 = 식별자의 마지막 부분 (태그를 잘못 쳐서 다른 앱의 릴리스·업데이트 파일에 올라가지 않게).
            if (base.identifier.split(".").pop() !== APP) {
              throw new Error(`app ${APP} is not the last part of identifier ${base.identifier}`);
            }
            if (CHANNEL === "prod" && base.version !== VERSION) {
              throw new Error(`version ${VERSION} is not tauri.conf.json version ${base.version}`);
            }
            const extra = CHANNEL === "dev" ? JSON.parse(fs.readFileSync(DEV_CONFIG, "utf8")) : {};
            fs.writeFileSync("src-tauri/tauri.ci.conf.json", JSON.stringify({ ...extra, version: VERSION }));
          '

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.SIGNING_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        with:
          projectPath: .
          tagName: ${{ needs.prepare.outputs.tag }}
          releaseName: ${{ needs.prepare.outputs.name }}
          releaseBody: ${{ inputs.notes }}
          releaseDraft: false
          prerelease: ${{ inputs.channel == 'dev' }}
          args: ${{ matrix.platform == 'macos' && '--target universal-apple-darwin' || '--bundles nsis' }} --config src-tauri/tauri.ci.conf.json

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.prepare.outputs.tag }}
      FILE: ${{ needs.prepare.outputs.file }}
    steps:
      - run: |
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p latest.json -O "$FILE"
          gh release upload updates "$FILE" -R "$GITHUB_REPOSITORY" --clobber
